<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Opdrachten" />
<meta name="theme-color" content="#0094FF" />
<title>Opdrachten</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: #F4F4F4; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #0A0A0A;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
    --accent: #0094FF;
  }
  body.team-rood { --accent: #F23D3D; }

  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 28px 20px 44px; }
  .verborgen { display: none !important; }

  .logo-rij { display: flex; justify-content: center; margin-bottom: 20px; }
  .logo-rij svg { width: 40%; max-width: 320px; height: auto; display: block; }

  /* ---------- Teamkeuze-scherm ---------- */
  #team-keuze .wrap { max-width: 560px; padding-top: 60px; text-align: center; }
  #team-keuze .logo-rij { margin-bottom: 40px; }
  #team-keuze .logo-rij svg { width: 55%; max-width: 300px; }
  .team-titel {
    font-family: 'Anton', 'Arial Black', sans-serif;
    font-size: 20px;
    letter-spacing: 0.5px;
    color: #0A0A0A;
    margin: 0 0 22px;
    text-transform: uppercase;
  }
  .team-knoppen { display: flex; flex-direction: column; gap: 16px; }
  .team-knop {
    font-family: 'Anton', 'Arial Black', sans-serif;
    font-size: 24px;
    letter-spacing: 0.5px;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 26px 20px;
    cursor: pointer;
    transition: transform 0.1s, filter 0.15s;
  }
  .team-knop:active { transform: scale(0.98); filter: brightness(0.92); }
  .team-knop.blauw { background: #0094FF; }
  .team-knop.rood { background: #F23D3D; }

  /* ---------- Opdrachten-scherm ---------- */
  .terug {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; font-weight: 600; color: #59564F;
    background: none; border: none; padding: 0; margin-bottom: 16px;
    cursor: pointer;
  }
  .terug:active { color: #0A0A0A; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  .kaart {
    position: relative;
    aspect-ratio: 3 / 2;
    background: #fff;
    border: 2px solid #0A0A0A;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, transform 0.1s;
  }
  .kaart:active { transform: scale(0.97); }
  .kaart.selected { cursor: default; }
  .kaart.selected:active { transform: none; }

  .kaart .tekst {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    text-align: center;
    color: #0A0A0A;
  }

  .kaart .mini-cijfer {
    position: absolute;
    bottom: 8px;
    right: 8px;
    min-width: 26px;
    height: 26px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 6px;
    font-family: 'Anton', 'Arial Black', sans-serif;
    font-style: normal;
    font-size: 16px;
    color: #fff;
  }
  .kaart.selected .mini-cijfer { display: none; }

  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: rgba(10, 10, 10, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .kaart.selected .overlay { opacity: 1; }

  .overlay .groot-cijfer {
    font-family: 'Anton', 'Arial Black', sans-serif;
    font-style: normal;
    font-size: 52px;
    color: #fff;
  }

  .acties { display: flex; justify-content: center; }
  .reset {
    font-family: 'Anton', 'Arial Black', sans-serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.3px;
    color: #fff;
    background: #0A0A0A;
    border: 2px solid #0A0A0A;
    border-radius: 8px;
    padding: 12px 28px;
  }
  .reset:active { background: var(--accent); border-color: #0A0A0A; }

  .leeg { font-size: 14px; color: #B3B0A8; font-style: italic; padding: 12px 2px; grid-column: 1 / -1; }
</style>
</head>

<!-- ---------- Opdrachten-scherm ---------- -->
<div id="opdrachten-scherm" class="verborgen">
  <div class="wrap">
    <button class="terug" id="terug-knop">← Terug naar teamkeuze</button>

    <div class="grid" id="lijst"></div>

    <div class="acties">
      <button class="reset" id="reset">SELECTIE RESETTEN</button>
    </div>
  </div>
</div>

<script>
  const OPSLAGSLEUTEL = "opdrachten-app-v8-";

  const teams = {
    team1: {
      kleurklasse: null, // blauw = standaard, geen extra klasse nodig
      opdrachten: [
        "Eet {n} {calorie|calorieën} aan eten", "Fiets {n} meter", "Loop {n} {traptrede|traptredes} op", "Ga {n} keer touwtje springen", "Maak samen een groepsfoto met {n} andere {persoon|personen}",
        "Dans onafgebroken {n} {seconde|seconden} op een openbare plek, waar andere mensen zijn", "Koop voor jezelf een item op Marktplaats voor {n} cent", "Haal samen een score van {n} op Kaasje", "Doneer {n} euro aan een goed doel", "Doe {n} {kikkersprong|kikkersprongen}",
        "Facetime iemand onafgebroken voor {n} {seconde|seconden} zonder iets te zeggen", "Knip {n} centimeter van je broek af", "Geef {n}% fooi", "Krijg {n} {comment|comments} op een Instagram post", "Maak samen een toren van {n} {voorwerp|voorwerpen}",
        "Geef {n} {persoon|personen} een high five", "Koop {n} {item|items} bij de Zara", "Schrijf een liefdesgedicht van {n} {zin|zinnen} over je teamgenoot", "Doe {n} {spuitje|spuitjes} parfum op jezelf", "Verbrand {n} {calorie|calorieën}"
      ]
    },
    team2: {
      kleurklasse: "team-rood",
      opdrachten: [
        "Drink {n} milliliter aan drinken", "Bankdruk een gewicht van {n} kilo (gewicht van meerdere reps bij elkaar optellen)", "Loop {n} {stap|stappen} achteruit", "Gooi een dart score van {n} (scores van meerdere beurten bij elkaar optellen)", "Win samen een potje touwtrekken van {n} {persoon|personen}",
        "Hang onafgebroken {n} {seconde|seconden} ondersteboven", "Geef {n} cent uit aan een item dat je zelf nooit zou kopen", "Sla samen {n} keer over tijdens een badminton rally", "Krijg {n} {viewer|viewers} op TikTok live", "Sta onafgebroken {n} {seconde|seconden} stil in de auto bij een groen stoplicht",
        "Lach onafgebroken {n} {seconde|seconden} lang wanneer een vreemde iets zegt", "Doe {n} extra {kledingstuk|kledingstukken} aan voor de rest van de video", "Maak {n}% van het bedrag van iemands lopende rekening naar diegene over", "Krijg {n} {share|shares} op een Instagram post", "Verander {n} {dag|dagen} je profielfoto op Instagram naar je lelijkste foto",
        "Plak {n} nep {tattoo|tattoos} op je lichaam die je voor de rest van de dag ophoudt", "Drink een drankje met {n}% alcohol (% van meerdere drankjes bij elkaar optellen)", "Krijg {n} {item|items} gratis", "Verdien samen {n} cent statiegeld", "Bouw een werkende dominobaan van {n} {steen|stenen}"
      ]
    }
  };

  let huidigTeam = null;
  let data = null;

  function laadData(teamKey) {
    const sleutel = OPSLAGSLEUTEL + teamKey;
    try {
      const opgeslagen = JSON.parse(localStorage.getItem(sleutel));
      if (opgeslagen && Array.isArray(opgeslagen.selectie)) return opgeslagen;
    } catch (e) {}
    return { selectie: [] };
  }

  function bewaar() {
    localStorage.setItem(OPSLAGSLEUTEL + huidigTeam, JSON.stringify(data));
  }

  function puntenVoor(index) {
    const positie = data.selectie.indexOf(index);
    if (positie !== -1) return Math.pow(2, positie);
    return Math.pow(2, data.selectie.length);
  }

  function vulTekstIn(template, n) {
    let resultaat = template.replace(/\{([^{}|]+)\|([^{}]+)\}/g, (_, enkelvoud, meervoud) =>
      n === 1 ? enkelvoud : meervoud
    );
    resultaat = resultaat.replace("{n}", n);
    return resultaat;
  }

  const lijstEl = document.getElementById("lijst");

  function render() {
    const opdrachten = teams[huidigTeam].opdrachten;
    lijstEl.innerHTML = "";

    opdrachten.forEach((template, index) => {
      const punten = puntenVoor(index);
      const isGeselecteerd = data.selectie.includes(index);

      const kaart = document.createElement("div");
      kaart.className = "kaart" + (isGeselecteerd ? " selected" : "");

      const span = document.createElement("span");
      span.className = "tekst";
      span.textContent = vulTekstIn(template, punten);

      const miniCijfer = document.createElement("span");
      miniCijfer.className = "mini-cijfer";
      miniCijfer.textContent = punten;

      const overlay = document.createElement("div");
      overlay.className = "overlay";
      const grootCijfer = document.createElement("span");
      grootCijfer.className = "groot-cijfer";
      grootCijfer.textContent = punten;
      overlay.appendChild(grootCijfer);

      kaart.appendChild(span);
      kaart.appendChild(miniCijfer);
      kaart.appendChild(overlay);

      kaart.addEventListener("click", () => {
        if (data.selectie.includes(index)) return;
        data.selectie.push(index);
        bewaar();
        render();
      });

      lijstEl.appendChild(kaart);
    });
  }

  function kiesTeam(teamKey) {
    huidigTeam = teamKey;
    data = laadData(teamKey);

    document.body.classList.remove("team-rood");
    if (teams[teamKey].kleurklasse) document.body.classList.add(teams[teamKey].kleurklasse);

    document.getElementById("team-keuze").classList.add("verborgen");
    document.getElementById("opdrachten-scherm").classList.remove("verborgen");
    render();
  }

  function naarTeamkeuze() {
    document.getElementById("opdrachten-scherm").classList.add("verborgen");
    document.getElementById("team-keuze").classList.remove("verborgen");
  }

  document.getElementById("btn-team1").addEventListener("click", () => kiesTeam("team1"));
  document.getElementById("btn-team2").addEventListener("click", () => kiesTeam("team2"));
  document.getElementById("terug-knop").addEventListener("click", naarTeamkeuze);

  document.getElementById("reset").addEventListener("click", () => {
    data.selectie = [];
    bewaar();
    render();
  });
</script>
</body>
